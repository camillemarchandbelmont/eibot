services:
  - type: web
    name: empire-immo-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.main
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DISCORD_TOKEN
        sync: false          # à saisir dans le dashboard Render
      - key: TICK_TOKEN
        generateValue: true  # généré par Render, à recopier dans cron-job.org
      # Secret partagé avec le site (projet Vercel), pour les routes /api/*.
      # Généré par Render puis recopié dans Vercel : ainsi il n'existe nulle
      # part en clair dans le dépôt. Distinct de TICK_TOKEN à dessein — celui-ci
      # circule dans une query string, donc dans les journaux d'accès.
      - key: API_SECRET
        generateValue: true
      # Les serveurs où déclarer les commandes, séparés par des virgules. Un
      # serveur absent de cette liste n'a aucune commande du bot. Si seul
      # `GUILD_ID` (singulier) est renseigné, il reste lu en repli : renommer
      # la clé ici ne coupe donc pas un déploiement existant.
      - key: GUILD_IDS
        sync: false
      # Base Supabase, à saisir dans le dashboard Render. Prendre la chaîne de
      # l'onglet « Session pooler » (port 5432, hôte `…pooler.supabase.com`) et
      # non celle de « Direct connection » : depuis que l'IPv4 y est une option
      # payante, la connexion directe ne résout qu'en IPv6, et rien ne garantit
      # que Render sorte en IPv6 — le bot démarrerait sans base, en silence.
      #
      # Le pooler en mode transaction (port 6543) marcherait aussi, le cache de
      # prepared statements étant désactivé côté code, mais le mode session donne
      # une connexion propre à chaque client et n'a rien à y gagner.
      - key: DATABASE_URL
        sync: false
      # Clé de l'API Empire Immo. Renseignée -> le bot lit l'export en ligne ;
      # laissée vide -> il retombe sur le CSV versionné dans le dépôt.
      - key: EMPIRE_API_KEY
        sync: false
      # À définir seulement si le monde change (M8 -> M9) ou si l'URL bouge.
      - key: EMPIRE_API_URL
        sync: false
      # Fourchette par défaut : 100 TØ -> 6 PØ
      - key: PRIX_MIN
        value: "1e14"
      - key: PRIX_MAX
        value: "6e15"
      - key: HEURE
        value: "09:00"
      - key: FUSEAU
        value: "Europe/Paris"
      # Salons, rôle et journal ne sont pas déclarés ici : ils se règlent par
      # /fourchette salon ajouter, /reglages mention et /reglages logs, et sont
      # persistés en base. Un ID codé dans le blueprint serait doublonné avec
      # la config Discord et prêterait à confusion.

# Aucun bloc `databases:` ici : la base vit chez Supabase depuis le 18 août 2026,
# la base gratuite de Render expirant au bout de trente jours. En laisser un
# ferait recréer une base Render vide à la prochaine application du blueprint, et
# le `fromDatabase` qui allait avec écraserait `DATABASE_URL` — le bot repartirait
# d'une config d'usine, sans la moindre erreur.
